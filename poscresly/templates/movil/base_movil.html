{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f4f5f7">
  <title>{% block title %}Inicio · Cresly POS{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'CSS/base.css' %}?v=4">
  <link rel="stylesheet" href="{% static 'CSS/inicio-movil.css' %}?v=4">
  <link rel="stylesheet" href="{% static 'CSS/barras.css' %}?v=5">
  <link rel="stylesheet" href="{% static 'CSS/pizzeria-bottom-nav.css' %}?v=5">
  {% block extra_css %}{% endblock %}
</head>
<body class="im-body">
  <!-- Mismo sidebar que el resto de la app (components/navbar.html), no
       un panel aparte — así el menú abre exactamente igual acá que en
       Mesas/Órdenes/Delivery. .im-body fuerza que siempre sea panel
       deslizable (ver inicio-movil.css): este shell no tiene el
       .app-layout de escritorio que lo posiciona como riel fijo. -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="mainSidebar">
    {% include 'components/navbar.html' %}
  </aside>

  {% block content %}{% endblock %}

  <script>
    window.CSRF_TOKEN = "{{ csrf_token }}";
  </script>
  <script src="{% static 'JS/sidebar.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
