{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cresly Pizzería - Ingreso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'CSS/variables.css' %}">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, var(--primary-color) 0%, #2b0006 100%);
      font-family: var(--fuente-principal);
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 16px;
      padding: 2.25rem 2rem;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .login-icon {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: var(--primary-color);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      margin: 0 auto 1rem;
    }
    .login-title { text-align: center; font-family: var(--fuente-titulos); font-weight: 700; margin-bottom: .25rem; }
    .login-subtitle { text-align: center; color: #6b7280; font-size: .9rem; margin-bottom: 1.75rem; }
    .btn-pizzeria {
      background: var(--primary-color); border-color: var(--primary-color); color: #fff;
    }
    .btn-pizzeria:hover { background: var(--primary-color-hover); border-color: var(--primary-color-hover); color: #fff; }
    .form-control { padding: .65rem .9rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon"><i class="fas fa-pizza-slice"></i></div>
    <div class="login-title">Cresly Pizzería</div>
    <div class="login-subtitle">Ingreso de meseros</div>

    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" name="username" class="form-control" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-pizzeria w-100 py-2 fw-semibold">
        <i class="fas fa-sign-in-alt me-2"></i>Ingresar
      </button>
    </form>
  </div>
</body>
</html>
