{% comment %}
Fila de movimiento (handoff_caja §4.4). Si se puede anular, la fila entera abre
la hoja ⋯ del movimiento; los textos de la hoja ya vienen armados de la vista.
{% endcomment %}
<li>
  {% if fila.id and not fila.anulado %}
  <button type="button" class="cj-mov cj-mov-{{ fila.tipo }} cj-mov-accion"
          data-cj-mov="{{ fila.id }}"
          data-titulo="{{ fila.titulo }}"
          data-sub="{{ fila.hoja_sub }}"
          data-monto="{{ fila.monto }}"
          data-confirma-titulo="{{ fila.confirma_titulo }}"
          data-confirma-texto="{{ fila.confirma_texto }}"
          data-bloqueo="{{ fila.bloqueo }}"
          aria-label="{{ fila.titulo }}, {{ fila.monto }}. Más acciones">
  {% else %}
  <div class="cj-mov cj-mov-{{ fila.tipo }}{% if fila.anulado %} cj-mov-anulado{% endif %}">
  {% endif %}
    <span class="cj-mov-glifo" aria-hidden="true">
      <i class="bi {% if fila.tipo == 'retiro' %}bi-arrow-up{% elif fila.tipo == 'gasto' %}bi-dash{% elif fila.tipo == 'ingreso' %}bi-plus{% else %}bi-house{% endif %}"></i>
    </span>
    <span class="cj-mov-texto">
      <span class="cj-mov-titulo">{{ fila.titulo }}</span>
      <span class="cj-mov-sub">{{ fila.sub }}</span>
    </span>
    <span class="cj-mov-montos">
      <span class="cj-mov-monto">{{ fila.monto }}</span>
      <span class="cj-mov-saldo">{{ fila.saldo }}</span>
    </span>
  {% if fila.id and not fila.anulado %}
    <i class="bi bi-three-dots cj-mov-mas" aria-hidden="true"></i>
  </button>
  {% else %}
  </div>
  {% endif %}
</li>
