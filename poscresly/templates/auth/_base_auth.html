{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="robots" content="noindex">
  <title>{% block title %}Ingresar{% endblock %} · Cresly POS</title>
  <link rel="icon" href="{% static 'icons/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
  <link rel="preload" as="image" href="{% static 'IMG/logo-640.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'CSS/auth.css' %}?v=2">
</head>
<body class="au-body">
  <main class="au-card">
    <div class="au-marca">
      <img class="au-logo" src="{% static 'IMG/logo-640.png' %}" alt="Cresly Pizzería" width="640" height="203">
      <span class="au-marca-sub">Punto de venta</span>
    </div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
